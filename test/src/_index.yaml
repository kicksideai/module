version: "1.0"
namespace: app

# Standalone harness for acme/starter. Provides the host resources the boot
# needs (app:db, app:processes, gateway + api router, env storage, a
# permissive actor scope) and wires them through wippy/bootloader so the
# co-located *_test.lua suites run in isolation. The router and gateway exist
# only so the endpoint and static entries resolve; the HTTP and UI surfaces
# are covered by the registry-shape suite, not exercised over HTTP.
# Harness-only; excluded from publish via the module wippy.yaml.

entries:
  - name: definition
    kind: ns.definition
    meta: { title: Starter Test Harness }

  - name: log_test
    kind: function.lua
    meta:
      type: test
      comment: Log sink publishes its port, persists rows, and acknowledges writes.
      group: Acme Starter
      suite: acme_starter
    source: file://log_test.lua
    modules: [funcs, registry, security, channel, time, uuid, process]
    imports:
      test: wippy.test:test
      repo: acme.starter.persist:repo
    method: run

  - name: realtime_broadcast
    kind: function.lua
    source: file://realtime_fixture.lua
    method: broadcast
    modules: [process, security]
    imports:
      repo: acme.starter.persist:repo
    security:
      policies: [app:notification_transport]

  - name: notification_transport
    kind: security.policy
    policy:
      resources: '*'
      actions: process.send
      effect: allow

  - name: writer
    kind: security.policy
    policy:
      resources: '*'
      actions: [access, db.get, registry.get, registry.find, contract.get, contract.open, contract.call,
        contract.implementations, contract.security, funcs.call, funcs.security]
      effect: allow

  - name: realtime_binding
    kind: contract.binding
    contracts:
      - contract: kickside.contract:realtime
        default: true
        methods:
          broadcast: app:realtime_broadcast
          notify: app:realtime_notify

  - name: realtime_notify
    kind: function.lua
    source: file://realtime_fixture.lua
    method: notify

  - name: wiring_test
    kind: function.lua
    meta:
      type: test
      comment: Endpoint, view, nav, and security entries exist and reference each other consistently.
      group: Acme Starter
      suite: acme_starter
    source: file://wiring_test.lua
    modules: [registry]
    imports:
      test: wippy.test:test
    method: run

  - name: db
    kind: db.sql.sqlite
    meta:
      comment: In-memory database for the starter suites.
    file: ":memory:"
    foreign_keys: true

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  # The endpoint and static entries resolve against these resources at boot;
  # no suite calls them over HTTP — the wiring suite checks registry shape.
  - name: gateway
    kind: http.service
    addr: :19219
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      server: gateway
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: Permissive actor scope for the suites.
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # The harness source is the lock root. Its .wippy.yaml replaces the declared
  # acme/starter dependency with ../ so the module's canonical source and
  # colocated tests load directly without a lock-file replacement.

  - name: starter_harness.dep.test
    version: "*"
    kind: ns.dependency
    component: "wippy/test"

  - name: starter_harness.dep.migration
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host binding for the migration dependency used by the module under test.
    component: "wippy/migration"
    parameters:
      - name: wippy.migration:app_db
        value: app:db

  - name: starter_harness.dep.contract
    version: "*"
    kind: ns.dependency
    meta:
      comment: Shared contract definitions imported by the replacement module under test.
    component: "kickside/contract"

  - name: starter_harness.dep.security
    version: "*"
    kind: ns.dependency
    meta:
      comment: Platform security groups (wippy.security:process) that give host-managed services their policy scope under strict mode.
    component: "wippy/security"

  - name: starter_harness.dep.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host wiring for the standalone test harness.
    component: "wippy/bootloader"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage

  - name: starter_harness.dep.module
    version: "*"
    kind: ns.dependency
    meta:
      comment: Module under test; test/.wippy.yaml replaces this package with the local checkout.
    component: "acme/starter"
    parameters:
      - name: acme.starter:target_db
        value: app:db
      - name: acme.starter:api_router
        value: app:api
      - name: acme.starter:ui_server
        value: app:gateway
      - name: acme.starter.security:user_security_scope
        value: app:user
