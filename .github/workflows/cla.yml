name: CLA

'on':
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  check:
    uses: kicksideai/.github/.github/workflows/cla.yml@d2c10e86e6130c95b2c88a21fd4383779e4dd27f
    secrets:
      CLA_APP_PRIVATE_KEY: ${{ secrets.CLA_APP_PRIVATE_KEY }}
