name: CLA

'on':
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  check:
    uses: kicksideai/.github/.github/workflows/cla.yml@ee731fdcfb7ebd68fac1f7db4b56dc2923bdc02d
    secrets:
      CLA_TOKEN: ${{ secrets.CLA_TOKEN }}
