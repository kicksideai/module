name: CLA

'on':
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  check:
    uses: kicksideai/.github/.github/workflows/cla.yml@a360a9024614a781c82815051e62ac72056b9444
    secrets:
      CLA_APP_PRIVATE_KEY: ${{ secrets.CLA_APP_PRIVATE_KEY }}
